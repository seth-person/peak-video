name: Windows installer
on:
  push:
    branches: [main]
    paths: ['windows/**', 'scripts/package-windows.ps1', 'scripts/windows-installer.nsi', 'scripts/dependencies.json', '.github/workflows/windows-release.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.402'
      - name: Install NSIS
        run: choco install nsis --yes --no-progress
      - name: Build and test
        shell: pwsh
        run: ./scripts/package-windows.ps1
      - name: Test installed application
        shell: pwsh
        run: |
          $installer = Start-Process ./dist/Peak-1.2.0-windows-x64.exe '/S' -Wait -PassThru
          if ($installer.ExitCode -ne 0) { throw 'Installation failed' }
          $uninstallCommand = (Get-ItemProperty 'HKCU:/Software/Microsoft/Windows/CurrentVersion/Uninstall/Peak').UninstallString
          if ($uninstallCommand -ne ('"' + "$env:LOCALAPPDATA\Programs\Peak\Uninstall.exe" + '"')) { throw 'Uninstaller registration is invalid' }
          $exe = "$env:LOCALAPPDATA/Programs/Peak/Peak.exe"
          $check = Start-Process $exe '--self-test' -Wait -PassThru
          if ($check.ExitCode -ne 0) { Get-Content "$env:LOCALAPPDATA/Programs/Peak/self-test-error.txt"; throw 'Installed app test failed' }
          $app = Start-Process $exe '--ui-smoke-test' -PassThru
          if (!$app.WaitForExit(30000)) { $app.Kill(); throw 'UI smoke test timed out' }
          if ($app.ExitCode -ne 0) { Get-Content "$env:LOCALAPPDATA/Programs/Peak/startup-error.txt"; throw 'UI startup failed' }
          if (!(Test-Path "$env:LOCALAPPDATA/Programs/Peak/ui-test-passed.txt")) { throw 'UI did not render' }
          Copy-Item "$env:LOCALAPPDATA/Programs/Peak/ui-preview.png" './dist/Peak-windows-preview.png'
          $fixture = "$env:RUNNER_TEMP/trim-fixture.mp4"
          & "$env:LOCALAPPDATA/Programs/Peak/Tools/ffmpeg.exe" -v error -f lavfi -i 'testsrc2=size=640x360:rate=30:duration=4' -c:v libx264 -pix_fmt yuv420p -y $fixture
          if ($LASTEXITCODE -ne 0) { throw 'Fixture creation failed' }
          $trim = Start-Process $exe -ArgumentList @('--trim-ui-smoke-test', ('"' + $fixture + '"')) -PassThru
          if (!$trim.WaitForExit(60000)) { $trim.Kill(); throw 'Trim UI timed out' }
          if ($trim.ExitCode -ne 0) { Get-Content "$env:LOCALAPPDATA/Programs/Peak/trim-ui-error.txt"; throw 'Trim UI failed' }
          if (!(Test-Path "$env:LOCALAPPDATA/Programs/Peak/trim-ui-test-passed.txt")) { throw 'Trim UI did not render' }
          Copy-Item "$env:LOCALAPPDATA/Programs/Peak/trim-ui-preview.png" './dist/Peak-windows-trim-preview.png'
          $uninstall = Start-Process "$env:LOCALAPPDATA/Programs/Peak/Uninstall.exe" '/S' -Wait -PassThru
          Start-Sleep -Seconds 3
          if (Test-Path $exe) { throw 'Uninstall did not remove app' }
      - uses: actions/upload-artifact@v4
        with:
          name: Peak-1.2.0-windows-x64
          path: |
            dist/Peak-1.2.0-windows-x64.exe
            dist/dependency-manifest-windows-x64.json
            dist/SHA256SUMS-windows-x64.txt
            dist/Peak-windows-preview.png
            dist/Peak-windows-trim-preview.png
          retention-days: 14
